[package]
name = "raven-desktop"
version = "0.3.5"
description = "Raven desktop runtime spike"
authors = ["Raven"]
edition = "2021"

[lib]
name = "raven_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
# Issue #67: the desktop session credential comes straight from the OS CSPRNG
# (macOS getentropy, Linux getrandom(2), else /dev/urandom, Windows ProcessPrng). Already in the tree via tauri.
getrandom = "0.3"
tauri-plugin-opener = "2"

# 릴리스 빌드(`cargo build --release --features custom-protocol`)에서만 켠다.
# 이 피처가 켜지면 프론트엔드가 dashboard/dist로 임베드되고 devUrl을 무시하므로,
# 항상 켜 두면 `tauri dev`가 dev 서버 대신 낡은 dist를 띄운다.
[features]
custom-protocol = ["tauri/custom-protocol"]
