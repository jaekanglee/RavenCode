[package]
name = "raven-desktop"
version = "0.3.12"
description = "Raven desktop runtime spike"
authors = ["Raven"]
edition = "2021"

[lib]
name = "raven_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
# Issue #41: `Builder::build()` 실패는 AppHandle 이 생기기 전이라 tauri-plugin-dialog 로는 알릴 수
# 없다(플러그인은 AppHandle 로 구동된다). rfd 는 Tauri 런타임 없이 OS 툴킷에 직접 말을 걸어
# (macOS NSAlert / Windows MessageBoxW / GTK) 이 시점에도 다이얼로그를 띄운다.
# 피처는 tauri-plugin-dialog 와 똑같이 맞춘다 — 다르면 cargo 피처 유니피케이션이
# xdg-portal/async-std 같은 두 번째 rfd 백엔드를 끌어와 리눅스 빌드가 plugin 과 달라진다.
rfd = { version = "0.16", default-features = false, features = ["common-controls-v6"] }
# Issue #67: the desktop session credential comes straight from the OS CSPRNG
# (macOS getentropy, Linux getrandom(2), else /dev/urandom, Windows ProcessPrng). Already in the tree via tauri.
getrandom = "0.3"
tauri-plugin-opener = "2"
# 손님 입장 요청 알림 (spec 2026-10-16-guest-access-design). Rust 쪽에서만 쓴다 — 웹뷰 권한(capability) 불필요.
tauri-plugin-notification = "2"

# 릴리스 빌드(`cargo build --release --features custom-protocol`)에서만 켠다.
# 이 피처가 켜지면 프론트엔드가 dashboard/dist로 임베드되고 devUrl을 무시하므로,
# 항상 켜 두면 `tauri dev`가 dev 서버 대신 낡은 dist를 띄운다.
[features]
custom-protocol = ["tauri/custom-protocol"]
