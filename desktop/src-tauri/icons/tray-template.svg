    <polygon points="17,11 22,12.5 21.5,5" fill="#000"/>
    <circle cx="13.5" cy="19.5" r="3.3" fill="#fff"/>
    <circle cx="22.5" cy="19.5" r="3.3" fill="#fff"/>
    <circle cx="14.3" cy="20.2" r="1.5" fill="#000"/>
    <circle cx="23.3" cy="20.2" r="1.5" fill="#000"/>
    <polygon points="16.2,23.6 19.8,23.6 18,27" fill="#fff"/>
