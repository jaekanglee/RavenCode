[default]
description = "Allow the webview to query the managed Python Core endpoint."
permissions = ["allow-core-endpoint", "allow-core-session-token", "allow-mcp-endpoint", "allow-core-status", "allow-restart-core", "allow-lan-access-status", "allow-set-lan-access", "allow-save-download-file", "allow-save-download-file-as", "allow-reveal-saved-export", "allow-app-version"]

[[permission]]
identifier = "allow-core-endpoint"
description = "Allow invoking the core_endpoint command."
commands.allow = ["core_endpoint"]

[[permission]]
identifier = "allow-core-session-token"
description = "Allow invoking the core_session_token command (Issue #67: the webview's Core API credential)."
commands.allow = ["core_session_token"]

[[permission]]
identifier = "allow-mcp-endpoint"
description = "Allow invoking the mcp_endpoint command."
commands.allow = ["mcp_endpoint"]

[[permission]]
identifier = "allow-core-status"
description = "Allow invoking the core_status command."
commands.allow = ["core_status"]

[[permission]]
identifier = "allow-restart-core"
description = "Allow invoking the restart_core command."
commands.allow = ["restart_core"]

[[permission]]
identifier = "allow-lan-access-status"
description = "Allow invoking the lan_access_status command (내부망 공개 스위치 상태)."
commands.allow = ["lan_access_status"]

[[permission]]
identifier = "allow-set-lan-access"
description = "Allow invoking the set_lan_access command (내부망 공개 켜고 끄기 + Core 재시작)."
commands.allow = ["set_lan_access"]

[[permission]]
identifier = "allow-save-download-file"
description = "Allow invoking the save_download_file command (문서 내보내기 파일 저장)."
commands.allow = ["save_download_file"]

[[permission]]
identifier = "allow-save-download-file-as"
description = "Allow invoking the save_download_file_as command (문서 내보내기 저장 위치 선택, Issue #4 D-2)."
commands.allow = ["save_download_file_as"]

[[permission]]
identifier = "allow-app-version"
description = "Allow invoking the app_version command (관리 화면의 현재 버전 표시)."
commands.allow = ["app_version"]

[[permission]]
identifier = "allow-reveal-saved-export"
description = "Reveal only the last file successfully saved by Rust."
commands.allow = ["reveal_saved_export", "begin_export"]
