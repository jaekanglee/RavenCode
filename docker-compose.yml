# Raven — Docker Compose (4 진입점 일괄, one command).
# v0.7.16+: 'version' 키 제거 (Docker Compose v2 deprecated).
# v0.7.36+: 이미지 태그를 GIT SHA로 핀 (코드 변경 후 stale 캐시로 인한
#   `templates/system/AGENTS.md` 등 옛 리소스를 컨테이너가 참조하는 사고 차단).
#
# 사용법:
#   docker compose build --build-arg GIT_SHA=$(git rev-parse --short HEAD)
#   docker compose up -d          # 위 build 결과의 새 이미지로만 기동
#   docker compose down           # stop + remove containers
#   docker compose logs -f api    # 로그 follow
#
# 외부 접속 (.env에서 HOST=0.0.0.0 권장):
#
# 인증 (Issue #14): API는 loopback/tailnet 외 출처에 Bearer 토큰을 요구한다. 컨테이너에서는
#   포트 매핑을 거친 호스트 요청, dashboard 컨테이너, 같은 망의 다른 컨테이너가 모두 bridge/
#   게이트웨이 IP로 보이므로 **모두 토큰이 필요하다** — Docker 대역은 신뢰하지 않는다.
#   1) 토큰 발급:  docker compose exec api python -m raven.cli mcp token add <이름>
#   2) 브라우저:   http://<host>:5173 → 로그인 화면에 토큰 입력 (HttpOnly 쿠키로 보관,
#                  dashboard 프록시가 /api 요청마다 Bearer로 실어 보낸다)
#   3) 그 외 클라이언트(모바일 등): Authorization: Bearer <token>
#   컨테이너 healthcheck는 컨테이너 안 loopback이라 토큰 없이 통과한다.
#   http://<host>:8765      # API
#   http://<host>:8766/mcp  # MCP HTTP
#   http://<host>:5173      # Dashboard
#
# MCP stdio는 docker exec -it raven-api / docker-entrypoint.sh mcp-stdio

x-raven-image: &raven_image
  build:
    context: .
    dockerfile: Dockerfile
    args:
      GIT_SHA: ${GIT_SHA:-latest}
  # v0.7.36+: 이미지 태그를 GIT SHA로 핀. 코드 변경 후 stale 캐시로 인한
  #   `templates/system/AGENTS.md` 등 옛 리소스를 컨테이너가 참조하는 사고 차단.
  # 병렬 빌드 시 동일 태그 충돌 회피는 README의 sequential build 절차로 해결.
  image: raven:${GIT_SHA:-latest}

services:
  api:
    <<: *raven_image
    container_name: raven-api
    command: ["api"]
    env_file:
      - .env
    # v0.7.20+: WIKI_VAULTS_DIR 환경변수 명시 (registry.py가 읽는 이름)
    # - 컨테이너 안에서는 mount target (/vaults) 사용해야 함
    # - RAVEN_VAULTS_DIR은 호스트 경로 (mount source)
    environment:
      - WIKI_VAULTS_DIR=/vaults
      # Issue #14: 컨테이너 안의 0.0.0.0 bind를 명시적으로 허용한다 (포트 매핑이 닿으려면
      # 필요). 노출 범위는 아래 ports가 정하고, 토큰 게이트는 그대로 적용된다.
      - RAVEN_ALLOW_REMOTE=1
    ports:
      - "${PORT_API}:8765"
    volumes:
      # ──────────────────────────────────────────────────────────────
      # v0.7.14+: vault 영속성 보장 (bind mount, 컨테이너 down/up 안전)
      # ──────────────────────────────────────────────────────────────
      # 1) 사용자 vault 외부 경로 ~/Raven → 컨테이너 /vaults
      #    → content/ + .vault.json + wiki.db + .mcp/ + backups/ + logs/
      #    → 마운트된 호스트 디렉토리에 영속. 컨테이너 재시작해도 보존.
      # 2) 다른 PC에서도 호스트의 동일 경로를 mount하면 동일하게 동작.
      - ${RAVEN_VAULTS_DIR}:/vaults
    working_dir: /vaults
    networks:
      - raven-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8765/api/vaults"]
      interval: 30s
      timeout: 5s
      retries: 3

  mcp-http:
    <<: *raven_image
    container_name: raven-mcp-http
    command: ["mcp-http"]
    env_file:
      - .env
    # v0.7.20+: WIKI_VAULTS_DIR 명시 (mount target /vaults)
    environment:
      - WIKI_VAULTS_DIR=/vaults
    ports:
      - "${PORT_MCP_HTTP}:8766"
    volumes:
      # v0.7.14+: vault 영속성 (api 서비스와 동일 mount)
      - ${RAVEN_VAULTS_DIR}:/vaults
    working_dir: /vaults
    networks:
      - raven-net
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sS -o /dev/null http://127.0.0.1:8766/mcp || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  dashboard:
    <<: *raven_image
    container_name: raven-dashboard
    command: ["dashboard"]
    env_file:
      - .env
    ports:
      - "${PORT_DASHBOARD}:5173"
    networks:
      - raven-net
    depends_on:
      - api
      - mcp-http
    restart: unless-stopped

networks:
  raven-net:
    driver: bridge
